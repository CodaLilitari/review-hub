[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-review-hub"
version = "0.2.0"
description = "Local subscription-first coordination of bounded AI reviews"
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
coda-review = "coda_review_hub.cli:main"
coda-review-mcp = "coda_review_hub.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
